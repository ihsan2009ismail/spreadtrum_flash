name: Build spd_dump Windows

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW and libusb
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build Windows executable
        run: |
          x86_64-w64-mingw32-gcc -DUSE_LIBUSB=1 -O2 -o spd_dump.exe spd_dump.c -lusb-1.0

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: spd_dump-windows
          path: spd_dump.exe
