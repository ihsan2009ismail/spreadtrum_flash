name: Windows PE build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-pe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross-compiler and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cmake

      - name: Build libusb for Windows
        shell: bash
        run: |
          git clone --depth 1 https://github.com/libusb/libusb.git "$RUNNER_TEMP/libusb"
          cmake -S "$RUNNER_TEMP/libusb" \
            -B "$RUNNER_TEMP/libusb-build" \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/mingw-libusb" \
            -DLIBUSB_BUILD_SHARED_LIBS=OFF \
            -DLIBUSB_BUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/libusb-build" --config Release --parallel
          cmake --install "$RUNNER_TEMP/libusb-build" --config Release

      - name: Build spd_dump.exe
        shell: bash
        run: |
          x86_64-w64-mingw32-gcc \
            -DUSE_LIBUSB=1 \
            -O2 -Wall -Wextra -std=c99 -pedantic \
            -I"$RUNNER_TEMP/mingw-libusb/include" \
            -o spd_dump.exe \
            spd_dump.c \
            -L"$RUNNER_TEMP/mingw-libusb/lib" \
            -lusb-1.0 \
            -lsetupapi \
            -lws2_32 \
            -luser32 \
            -ladvapi32

      - name: Verify PE format
        shell: bash
        run: |
          file spd_dump.exe
          x86_64-w64-mingw32-objdump -f spd_dump.exe

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: spd_dump-windows
          path: spd_dump.exe
          if-no-files-found: error
