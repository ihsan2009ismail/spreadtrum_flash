name: Windows PE build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-pe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross-compiler and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zstd wget file

      - name: Install prebuilt libusb for MinGW
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/msys2"
          wget -q -O "$RUNNER_TEMP/libusb.pkg.tar.zst" \
            https://mirror.msys2.org/mingw/mingw64/mingw-w64-x86_64-libusb-1.0.30-1-any.pkg.tar.zst
          tar --zstd -xf "$RUNNER_TEMP/libusb.pkg.tar.zst" -C "$RUNNER_TEMP/msys2"
          test -f "$RUNNER_TEMP/msys2/mingw64/include/libusb-1.0/libusb.h"
          test -f "$RUNNER_TEMP/msys2/mingw64/lib/libusb-1.0.a"

      - name: Build spd_dump.exe
        shell: bash
        run: |
          x86_64-w64-mingw32-gcc \
            -DUSE_LIBUSB=1 \
            -O2 -Wall -Wextra -std=c99 -pedantic \
            -I"$RUNNER_TEMP/msys2/mingw64/include" \
            -o spd_dump.exe \
            spd_dump.c \
            -L"$RUNNER_TEMP/msys2/mingw64/lib" \
            -lusb-1.0 \
            -lsetupapi \
            -lws2_32 \
            -luser32 \
            -ladvapi32

      - name: Verify PE format
        shell: bash
        run: |
          file spd_dump.exe
          x86_64-w64-mingw32-objdump -f spd_dump.exe

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: spd_dump-windows
          path: spd_dump.exe
          if-no-files-found: error
