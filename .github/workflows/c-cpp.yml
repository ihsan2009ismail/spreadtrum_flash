name: Build spd_dump Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW and libusb build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 autoconf automake libtool pkg-config

      - name: Build libusb for Windows
        run: |
          git clone --depth 1 https://github.com/libusb/libusb.git
          cd libusb
          ./autogen.sh
          ./configure --host=x86_64-w64-mingw32 --prefix="$HOME/mingw-libusb"
          make -j2
          make install

      - name: Build spd_dump.exe
        run: |
          x86_64-w64-mingw32-gcc \
            -DUSE_LIBUSB=1 \
            -O2 -Wall -Wextra -std=c99 -pedantic \
            -I"$HOME/mingw-libusb/include" \
            -o spd_dump.exe \
            spd_dump.c \
            -L"$HOME/mingw-libusb/lib" \
            -lusb-1.0 \
            -lsetupapi \
            -lws2_32 \
            -luser32 \
            -ladvapi32

      - name: Verify Windows PE artifact
        run: file spd_dump.exe

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: spd_dump-windows
          path: spd_dump.exe
